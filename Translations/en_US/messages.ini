plugin.mcp.config.enabled="Enable the MCP endpoint"
plugin.mcp.config.enabled.tooltip="Master switch for /mcp. The plugin must also be published under Settings, Plugins, and the REST API must be enabled."
plugin.mcp.config.allow_write="Allow writing"
plugin.mcp.config.allow_write.tooltip="Offer the tools that create and change contacts, segments, campaigns and emails. Off means the connected assistant can only read."
plugin.mcp.config.allow_delete="Allow deleting and sending"
plugin.mcp.config.allow_delete.tooltip="Offer the tools that permanently delete records and send email to real recipients. Requires writing to be allowed."
plugin.mcp.config.allow_passthrough="Allow the raw API tool"
plugin.mcp.config.allow_passthrough.tooltip="Offer a tool that can call any Mautic REST API route directly. Powerful, and harder to predict than the named tools."
plugin.mcp.config.allow_oauth="Allow OAuth connections"
plugin.mcp.config.allow_oauth.tooltip="Let MCP clients register themselves and ask a logged in Mautic user for approval. This is how Claude and ChatGPT connect."
plugin.mcp.config.allow_basic_auth="Allow HTTP basic auth"
plugin.mcp.config.allow_basic_auth.tooltip="Accept a Mautic username and password on the MCP endpoint. Requires basic auth to be enabled in API Settings."
plugin.mcp.config.static_token="Fixed bearer token"
plugin.mcp.config.static_token.tooltip="A token for clients that cannot run an OAuth flow. Use at least 32 random characters, and treat it like a password."
plugin.mcp.config.static_token_user="Fixed token acts as"
plugin.mcp.config.static_token_user.tooltip="The Mautic user whose permissions apply to every call made with the fixed token."
plugin.mcp.config.static_token_user.none="No user selected"
plugin.mcp.config.access_token_lifetime="Access token lifetime (seconds)"
plugin.mcp.config.access_token_lifetime.tooltip="How long an issued access token stays valid. Clients refresh automatically."
plugin.mcp.config.refresh_token_lifetime="Refresh token lifetime (seconds)"
plugin.mcp.config.refresh_token_lifetime.tooltip="How long a client can keep refreshing before the user has to approve the connection again."
mautic.mcp.config.header="MCP Server"
mautic.config.tab.mcpbundleconfig="MCP Server"
